spring.application.name=library-accounting
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/library_db}
spring.datasource.username=${DB_USERNAME:library_user}
spring.datasource.password=${DB_PASSWORD:library_pass}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.sql.init.mode=always
spring.jackson.serialization.write-dates-as-timestamps=false
server.servlet.session.timeout=8h
server.error.include-message=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

library.bootstrap.admin-login=${ADMIN_LOGIN:admin}
library.bootstrap.admin-password=${ADMIN_PASSWORD:admin123}